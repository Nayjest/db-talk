[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-talk"
version = "0.0.1"
description = "Natural language to SQL query interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Vitalii Stepanenko", email = "mail@vitalii.in" },
]
keywords = ["sql", "nlp", "database", "query", "natural-language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ai-microcore>=5.0.0a1",
    "dotenv>=0.9.9",
    "sqlalchemy",
    "asyncpg~=0.30.0",
    "geoalchemy2",
    "geopandas",
    "pydantic>=2.12.4",
    "fastapi>=0.116.1",
    "uvicorn>=0.22.0",
    "typer>=0.16.1",
    "requests~=2.32.3",
    "pydantic~=2.12.3",
    "asyncpg"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]
[project.urls]
Homepage = "https://github.com/Nayjest/db-talk"
Repository = "https://github.com/Nayjest/db-talk"
Issues = "https://github.com/Nayjest/db-talk/issues"

[tool.hatch.build.targets.wheel]
packages = ["db_talk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
